name: PC Client — Build Windows EXE

on:
  push:
    branches: [main, opti_v3_openvino]
    paths:
      - "pc_client/**"
      - ".github/workflows/pc-client-build.yml"
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: pc_client

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: pc_client/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: pc_client/src-tauri -> target

      - name: Install npm dependencies
        run: npm ci

      - name: Build Tauri app
        run: npm run tauri build

      - name: Upload EXE installer
        uses: actions/upload-artifact@v4
        with:
          name: ALPR-Monitor-Windows
          path: |
            pc_client/src-tauri/target/release/bundle/nsis/*.exe
            pc_client/src-tauri/target/release/bundle/msi/*.msi
          retention-days: 30
          if-no-files-found: warn
